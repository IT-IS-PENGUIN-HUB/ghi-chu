[package]
name = "ghichu"
version = "2.0.0"
description = "Ghi chú hàng ngày — checklist nổi trên desktop"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"

[lib]
name = "ghichu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The installer ships to one user's machine, so optimise for size over
# compile time.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
